[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jopat"
version = "0.1.0"
description = "JOPAT: Joint Observation-Action Prediction with Auxiliary Tracks"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = { find = { include = ["configs*", "models*", "datasets*", "environments*", "experiments*"] } }

[tool.setuptools.package-data]
configs = ["**/*.yaml"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"
