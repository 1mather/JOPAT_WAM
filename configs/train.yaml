defaults:
  - dataset: libero_track
  - model: jopat
  - _self_

hydra:
  run:
    dir: ${output_root}/${algo}/${dataset.name}/${exp_id}/${seed}

algo: JOPAT
exp_id: default
seed: 0
output_root: ./outputs
logdir: ${hydra:run.dir}

resume: false
resume_checkpoint_path: null
pretrain_checkpoint_path: null

num_steps: 100000
eval_every: 10000
save_every: 5000
rollout_every: 2500
num_rollouts: 50
rollout_length: 1000

batch_size: 72
num_workers: 8
num_frames: 19
obs_num_frames: 2
use_amp: false
clip_grad_norm: 1.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: constant

wandb:
  enabled: false
  project: JOPAT
